# TrainBlink Server Configuration

server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug" # debug, release, test
  read_timeout: 30s
  write_timeout: 30s
  max_header_bytes: 1048576 # 1MB

database:
  host: "localhost"
  port: 5432
  user: "trainblink"
  password: "changeme"
  dbname: "trainblink_db"
  sslmode: "disable"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600s

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5

jwt:
  secret: "your-super-secret-jwt-key-change-in-production"
  issuer: "trainblink-server"
  expiration: 86400 # 24 hours in seconds
  refresh_expiration: 604800 # 7 days

websocket:
  read_buffer_size: 1024
  write_buffer_size: 1024
  max_message_size: 10485760 # 10MB
  ping_period: 54s
  pong_wait: 60s
  write_wait: 10s

station:
  max_peers_per_station: 100
  peer_timeout: 60s # Remove stale peers after 60s
  discovery_radius: 500 # meters

message:
  max_message_length: 10000 # characters
  ephemeral_default_lifetime: 10s
  max_messages_per_chat: 500
  send_timeout: 30s

content:
  max_file_size: 10485760 # 10MB
  allowed_image_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
  compression_quality: 0.7
  storage_path: "/var/trainblink/uploads"

moderation:
  enabled: true
  nsfw_threshold: 0.3 # Confidence threshold for NSFW detection
  face_detection_enabled: true
  auto_reject_nsfw: true

analytics:
  enabled: true
  event_buffer_size: 1000
  flush_interval: 60s

logging:
  level: "info" # debug, info, warn, error, fatal
  format: "json" # json, console
  output: "stdout" # stdout, stderr, or file path
  max_size: 100 # megabytes
  max_backups: 3
  max_age: 28 # days
  compress: true

rate_limiting:
  enabled: true
  requests_per_second: 100
  burst: 200
  cleanup_interval: 300s

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "https://trainblink.app"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
  allow_credentials: true
  max_age: 43200 # 12 hours
